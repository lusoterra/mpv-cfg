# autocrop-webm options — delete a line (or the file) to use the default.
# Scan whole file with ffmpeg cropdetect, push union crop to webm.lua.
# Keybinds (empty string disables):
#keybind_scan=C
#keybind_tag=U
# Sampling: n = clamp(ceil(duration / sample_interval), min_samples, max_samples)
#sample_interval=1.0
#min_samples=8
#max_samples=30
# Seconds of video decoded per probe:
#probe_duration=0.7
# Seconds at the end to skip when sampling (end-card watermarks):
#ignore_last_seconds=2.0
# Rename source to *.UNCROPPED.* automatically after a successful webm encode:
#auto_tag_after_encode=yes
#tag_suffix=.UNCROPPED
