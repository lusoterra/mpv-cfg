# copyparty upload options — delete a line (or the file) to use the default.
# Flow: press the keybind while anything is playing and the file is
# uploaded as-is (no encoding). Good for offloading big originals.
# If the name already exists on the server you get a choice (ESC cancels
# by default, so nothing is ever overwritten by accident):
# [y] upload anyway, [r] auto-rename to name-2.ext, [c] copy the existing
# link to the clipboard, ...
# Keybind (empty string disables):
keybind=P
# Your copyparty folder URL, trailing slash recommended:
copyparty_url=https://f.lusosterone.net/Meme/
# Account name on servers with --usernames. Empty means the password
# alone is used (header "PW: <password>"); otherwise
# "PW: <user>:<password>" is sent:
copyparty_user=lev
# Optional SOCKS proxy, e.g. socks5h://127.0.0.1:9050. Only ports
# 4447 (i2p) and 9050 (tor) are accepted; socks5:// is upgraded to
# socks5h:// so hostnames never leak through local DNS.
# Plain http:// uploads are refused unless they stay on loopback or
# use the matching proxy (.onion needs :9050, .i2p needs :4447).
#copyparty_proxy=
# File holding COPYPARTY_PASSWORD=... (gitignored, never committed).
# The script never prints or logs the password; curl gets it through
# a 0600 temp config file that is deleted after every upload:
password_file=~/.config/mpv/copyparty.env
# Copy the hotlink to the clipboard on success:
copy_to_clipboard=yes
# Open the hotlink in a browser on success:
open_after_upload=no
