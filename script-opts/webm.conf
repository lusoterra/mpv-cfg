# webm.lua options — see scripts/webm.lua header for all keys.
# Disable "encode & upload" (u) by default so a stray keypress can't
# upload something confidential. To re-enable, set e.g.:
#   upload_curl_path=curl
upload_curl_path=""
# Two-pass stats you never look at go to temp storage instead of the repo
# or your video folders. The OS clears /tmp on reboot.
pass_log_dir=/tmp/opencode
# Audio: LAME MP3 V0 instead of ffmpeg's native AAC.
# --oac= comes after the format default so it wins; flags=+qscale switches
# LAME into VBR quality mode (default quality 0 = V0) and the strict-mode
# audio bitrate is then ignored for sizing (verified: same bytes as -q:a 0).
# NOTE: applies to every webm.lua format (except raw, which this would
# change from pcm to mp3 — don't use raw with this set).
additional_flags=--oac=libmp3lame --oacopts-add=flags=+qscale
# V0 averages ~200kbps on real audio; reserve realistic headroom so the
# strict video budget math stays honest (was sized for 64k CBR).
strict_audio_bitrate=200
