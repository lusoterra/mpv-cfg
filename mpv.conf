# MPV configuration file

profile=gpu-hq
vo=gpu-next
hwdec=auto-copy-safe
dscale=catmull_rom
deband-grain=0

osd-font='JetBrainsMono Nerd Font Mono'
osd-font-size=32

volume-max=100

autoload-files=no

# nightcore!!
af=scaletempo=speed=pitch
no-audio-pitch-correction

screenshot-directory=~/Files/Screenshots/mpv/
screenshot-format=webp
screenshot-high-bit-depth
screenshot-webp-lossless
screenshot-webp-compression=6

keep-open=yes

geometry=60%x60%
keepaspect=yes
keepaspect-window=no
autofit-larger=90%
autofit-smaller=400x225

no-osc
no-osd-bar
osd-duration=2000
osd-font-size=32
osd-border-color="#262626"
cursor-autohide-fs-only
cursor-autohide=500
border=no

load-context-menu=no

[extension.gif]
save-position-on-quit=no
loop-file
no-cache

[extension.webp]
save-position-on-quit=no
loop-file
no-cache
